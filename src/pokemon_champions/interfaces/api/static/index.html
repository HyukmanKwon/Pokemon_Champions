<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>포켓몬 챔피언스 DB</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<h1>포켓몬 챔피언스 DB</h1>

<nav class="tabs" id="tabs">
  <button data-tab="team" class="on">내 팀</button>
  <button data-tab="pokemon">포켓몬</button>
  <button data-tab="move">기술</button>
  <button data-tab="ability">특성</button>
  <button data-tab="item">도구</button>
  <button data-tab="usage">채용률</button>
  <button data-tab="calc">계산기</button>
  <button data-tab="agent">도우미</button>
</nav>

<!-- 넓은 화면에서는 왼쪽이 덱 목록, 오른쪽이 포켓몬 3×2 다.
     좁아지면 .team-layout 이 한 줄로 접히고 덱 목록이 위로 간다. -->
<section class="panel" id="panel-team">
  <div class="team-layout">
    <aside id="deckbar" class="deckbar"></aside>
    <div id="grid" class="grid"></div>
  </div>
</section>
<section class="panel" id="panel-pokemon" hidden></section>
<section class="panel" id="panel-move" hidden></section>
<section class="panel" id="panel-ability" hidden></section>
<section class="panel" id="panel-item" hidden></section>
<section class="panel" id="panel-usage" hidden></section>
<section class="panel" id="panel-calc" hidden></section>
<section class="panel" id="panel-agent" hidden>
  <div id="chat-log" class="chat-log"></div>
  <form id="chat-form" class="chat-form">
    <input id="chat-input" autocomplete="off"
           placeholder="예: 내 팀이 한카리아스 지진을 버티나?">
    <button type="submit">묻기</button>
  </form>
</section>


<!-- 순서가 곧 의존 순서다. common 이 먼저 오지 않으면 나머지가
     esc·typeKo 를 못 찾는다. type="module" 이 아니라 평범한
     <script> 라서 최상단 const 를 서로 그대로 쓴다. -->
<script src="/static/js/common.js"></script>
<script src="/static/js/tabs.js"></script>
<script src="/static/js/dex.js"></script>
<script src="/static/js/team.js"></script>
<script src="/static/js/decks.js"></script>
<script src="/static/js/usage.js"></script>
<script src="/static/js/calc.js"></script>
<script src="/static/js/agent.js"></script>
</body>
</html>
