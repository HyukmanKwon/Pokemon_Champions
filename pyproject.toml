[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-champions"
version = "0.1.0"
description = "포켓몬 챔피언스 (레귤레이션 M-B) 데이터베이스 · 계산기 · 배틀 도우미"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9",
    "requests>=2.31",
]

[project.optional-dependencies]
# 웹 인터페이스를 쓸 때만 필요하다. CLI·계산기는 이것 없이 돈다.
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# API 도우미(GPT·Gemini)를 쓸 때만. 로컬 Ollama 는 requests 로 붙으므로
# 이것 없이도 돈다 — 인터넷이 없는 자리에서 도감·계산기가 막히지 않게.
llm = ["openai>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pokemon-cli = "pokemon_champions.interfaces.cli:main"

[tool.setuptools.packages.find]
# src/ 만 훑는다. scripts/ 와 tests/ 는 배포 패키지에 들어가지 않는다.
where = ["src"]

[tool.setuptools.package-data]
"pokemon_champions.interfaces.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ 는 설치되지 않으므로(where = ["src"]) 테스트에서 import 하려면
# 프로젝트 루트가 경로에 있어야 한다. conftest.py 의 overrides 격리 픽스처가
# scripts.etl.overrides 를 쓴다. 코드 안에서 sys.path 를 손대지 않으려고
# 여기에 적는다 — 실행 위치가 코드의 일부가 되는 것을 막는 편이 낫다.
pythonpath = ["."]
